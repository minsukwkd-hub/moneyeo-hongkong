name = "suzi-proxy"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
ALLOWED_ORIGIN = "https://minsukwkd-hub.github.io,http://localhost:8765,http://127.0.0.1:8765"
ALLOWED_MODELS = "claude-opus-5-5,claude-sonnet-5-5,claude-haiku-5-5"

# IP당 호출 제한: 60초에 30번 (Cloudflare Rate Limiting 바인딩, 무료)
# 한 질문이 도구 호출로 2~4회 API를 부르고, 같은 와이파이의 일행이 동시에 쓸 수 있어 10회는 부족하다.
[[ratelimits]]
name = "SUZI_RL"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# 공유 사진 올리기는 한 번에 수십 장이라 따로 넉넉하게
[[ratelimits]]
name = "UP_RL"
namespace_id = "1002"
simple = { limit = 120, period = 60 }

# 공유 코드 보관(KV, 90일 만료). id는 리소스 식별자(비밀 아님)
[[kv_namespaces]]
binding = "SHARE"
id = "daff4387d6464e768a592b0957d23f0a"

# 공유 사진 보관(R2, 수명주기 90일). R2는 대시보드에서 한 번 활성화해야 한다(결제 수단 등록, 무료 한도 10GB).
# 활성화한 뒤: npx wrangler r2 bucket create tokki-photos && npx wrangler r2 bucket lifecycle add tokki-photos --expire-days 90
# 그다음 아래 세 줄의 주석을 풀고 npx wrangler deploy. Worker는 바인딩이 없으면 사진 기능만 끄고 돈다.
# [[r2_buckets]]
# binding = "PHOTOS"
# bucket_name = "tokki-photos"

# 실행 위치 고정: Anthropic API는 홍콩(HKG) 발신을 403으로 막는다. 사용자가 홍콩·마카오에 있어도 Worker는 도쿄에서 돌게 한다.
[placement]
region = "aws:ap-northeast-1"
