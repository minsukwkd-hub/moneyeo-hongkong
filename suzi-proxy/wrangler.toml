name = "suzi-proxy"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
ALLOWED_ORIGIN = "https://minsukwkd-hub.github.io"
ALLOWED_MODELS = "claude-opus-5-5,claude-sonnet-5-5,claude-haiku-5-5"

# IP당 호출 제한: 60초에 10번 (Cloudflare Rate Limiting 바인딩, 무료)
[[ratelimits]]
name = "SUZI_RL"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
